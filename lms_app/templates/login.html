{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 bg-white">
            <div class="card-body p-4">
                <div class="text-center mb-4">

                    <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-3">
                        <svg xmlns="http://w3.org" width="32" height="32" fill="currentColor" class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
                            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2M5 9.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zm2 1a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 1 0v-1a.5.5 0 0 0-.5-.5"/>
                        </svg>
                    </div>
                    <h3 class="fw-bold mb-1 text-dark">Sign In</h3>
                    <p class="text-muted small">Access your LockIn LMS student or instructor portal</p>
                </div>

                <form method="POST" action="{{ url_for('users.sign_in') }}">
                    <div class="mb-3">
                        <label for="userEmail" class="form-label fw-medium text-dark small">Email Address</label>
                        <input id="userEmail" name="email" type="email" class="form-control" placeholder="name@example.com" required autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label for="userPassword" class="form-label fw-medium text-dark small">Password</label>
                        <input id="userPassword" name="password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                        Enter Workspace Portal
                    </button>
                </form>

                <hr class="opacity-10 my-3">

                <div class="text-center">
                    <p class="small text-secondary mb-0">
                        New to LockIn? 
                        <a href="{{ url_for('users.register_page') }}" class="text-decoration-none fw-semibold link-primary ms-1">
                            Create an Account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
